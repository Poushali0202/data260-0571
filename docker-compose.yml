services:
  grocery-notices:
    build:
      context: .
      dockerfile: Dockerfile
    image: data260-hw1-0571:latest
    ports:
      - "8571:80"
    restart: unless-stopped
    profiles: ["hw1"]

  kafka:
    image: apache/kafka:3.9.2
    container_name: s0571-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  redis:
    image: redis/redis-stack:7.4.0-v0
    container_name: s0571-redis
    ports:
      - "6379:6379"

  notice-worker:
    build: ./notice_service
    container_name: s0571-notice-worker
    command: python worker.py
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      TZ: America/Los_Angeles
    depends_on:
      - kafka
    restart: on-failure

  notice-api:
    build: ./notice_service
    container_name: s0571-notice-api
    command: uvicorn api:app --host 0.0.0.0 --port 8571
    ports:
      - "8571:8571"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      TZ: America/Los_Angeles
    depends_on:
      - kafka
    restart: on-failure
